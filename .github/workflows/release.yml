name: app-release

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Проверка тега и версии
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          FILE_VERSION="$(sed -n 's/^versionName=//p' app/version.properties | tr -d '[:space:]')"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Тег app-v$VERSION не совпадает с versionName=$FILE_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Подготовка release-подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Не задан секрет APP_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/distillarium-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/distillarium-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 keystore.properties

      - name: Тесты, lint и release APK
        run: ./gradlew --no-daemon :core:content:test :app:testDebugUnitTest lintDebug assembleRelease

      - name: Проверка подписи APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Манифест обновления
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/distillarium-$VERSION.apk"
          node tools/app-release-manifest.mjs \
            --version "$VERSION" \
            --apk "dist/distillarium-$VERSION.apk" \
            --out dist/app-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --notes "Версия $VERSION"

      - name: Публикация версии
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Дистиллярий $VERSION" \
              --notes "Релиз приложения $VERSION." \
              --verify-tag
          gh release upload "$TAG" \
            "dist/distillarium-$VERSION.apk" dist/app-manifest.json --clobber

      - name: Обновление app-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || \
            gh release create app-latest \
              --target "$GITHUB_SHA" \
              --title "app-latest" \
              --notes "Всегда последний релиз приложения."
          gh release upload app-latest dist/app-manifest.json --clobber
